# MCP Conductor Development Docker Compose
# For development with hot reload and debugging

version: '3.8'

services:
  mcp-conductor-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mcp-conductor-dev
    restart: unless-stopped
    
    # Environment variables for development
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - WEB_PORT=3000
      - WEB_HOST=0.0.0.0
      - ENCRYPTION_KEY=development-key-not-for-production-use
    
    # Ports
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js debugger
    
    # Volumes for development
    volumes:
      - .:/app  # Mount entire project for hot reload
      - /app/node_modules  # Exclude node_modules
      - conductor-dev-data:/app/data
      - conductor-dev-logs:/app/logs
    
    # Command for development with hot reload
    command: npm run dev
    
    # Enable debugging
    stdin_open: true
    tty: true

  # Development database
  postgres-dev:
    image: postgres:15-alpine
    container_name: mcp-conductor-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mcp_conductor_dev
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=dev-password
    volumes:
      - conductor-dev-postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port to avoid conflicts

  # Development Redis
  redis-dev:
    image: redis:7-alpine
    container_name: mcp-conductor-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - conductor-dev-redis:/data
    ports:
      - "6380:6379"  # Different port to avoid conflicts

volumes:
  conductor-dev-data:
  conductor-dev-logs:
  conductor-dev-postgres:
  conductor-dev-redis:

